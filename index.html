<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access Required</title>
    <meta
      name="description"
      content="A simple private access gate for a website."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M20 28h24v20H20z' fill='%23f8fafc'/%3E%3Cpath d='M25 28v-7a7 7 0 0 1 14 0v7' fill='none' stroke='%236ee7b7' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='38' r='3' fill='%230b1220'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: rgba(15, 23, 42, 0.82);
        --panel-strong: rgba(15, 23, 42, 0.95);
        --text: #f8fafc;
        --muted: #9aa9bd;
        --line: rgba(148, 163, 184, 0.24);
        --accent: #6ee7b7;
        --accent-strong: #34d399;
        --danger: #fb7185;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 24% 18%, rgba(110, 231, 183, 0.16), transparent 30%),
          radial-gradient(circle at 78% 74%, rgba(96, 165, 250, 0.14), transparent 26%),
          linear-gradient(135deg, #07111f 0%, #101927 54%, #0c1724 100%);
        color: var(--text);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .gate,
      .site-shell {
        width: min(100%, 430px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .gate {
        padding: 28px;
      }

      .lock-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(110, 231, 183, 0.4);
        border-radius: 8px;
        background: rgba(110, 231, 183, 0.1);
        margin-bottom: 22px;
      }

      .lock-mark svg {
        width: 24px;
        height: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 1rem;
      }

      form {
        display: grid;
        gap: 14px;
        margin-top: 28px;
      }

      label {
        font-size: 0.9rem;
        color: #dbeafe;
      }

      .code-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .input-wrap {
        position: relative;
        min-width: 0;
      }

      input {
        width: 100%;
        min-width: 0;
        height: 52px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 8px;
        background: rgba(2, 6, 23, 0.6);
        color: var(--text);
        font: 700 1.2rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.16em;
        padding: 0 56px 0 16px;
        text-transform: uppercase;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(110, 231, 183, 0.14);
      }

      button {
        height: 52px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #052e22;
        cursor: pointer;
        font: 800 0.95rem/1 Inter, ui-sans-serif, system-ui, sans-serif;
        padding: 0 18px;
      }

      button:hover,
      button:focus-visible {
        background: var(--accent-strong);
      }

      .visibility-button {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 40px;
        height: 40px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: rgba(248, 250, 252, 0.08);
        color: var(--text);
      }

      .visibility-button:hover,
      .visibility-button:focus-visible {
        background: rgba(248, 250, 252, 0.14);
      }

      .message {
        min-height: 22px;
        color: var(--danger);
        font-size: 0.92rem;
      }

      .site-shell {
        width: min(100%, 760px);
        overflow: hidden;
      }

      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-strong);
      }

      .site-header strong {
        font-size: 0.95rem;
      }

      .lock-button {
        width: 40px;
        height: 40px;
        padding: 0;
        display: grid;
        place-items: center;
        background: rgba(248, 250, 252, 0.08);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .lock-button:hover,
      .lock-button:focus-visible {
        background: rgba(248, 250, 252, 0.14);
      }

      .placeholder {
        padding: 52px 32px;
      }

      .placeholder h2 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 5vw, 3rem);
        line-height: 1.02;
      }

      #account-title {
        margin-bottom: 8px;
        color: var(--accent);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 540px) {
        main {
          padding: 18px;
        }

        .gate {
          padding: 22px;
        }

        .code-row {
          grid-template-columns: 1fr;
        }

        .code-row > button {
          width: 100%;
        }

        .placeholder {
          padding: 38px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="gate" id="gate" aria-labelledby="gate-title">
        <div class="lock-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M7 10V7a5 5 0 0 1 10 0v3"
              stroke="#6ee7b7"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M6 10h12v10H6z"
              stroke="#f8fafc"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1 id="gate-title">Enter Code</h1>
        <p>Use your 13-character account code to continue.</p>

        <form id="access-form" autocomplete="off" novalidate>
          <label for="access-code">Access code</label>
          <div class="code-row">
            <div class="input-wrap">
              <input
                id="access-code"
                name="access-code"
                type="password"
                inputmode="text"
                minlength="17"
                maxlength="17"
                placeholder="XXXX-XXX-XX-XXX-X"
                aria-describedby="code-message"
                autocomplete="off"
                spellcheck="false"
                required
              />
              <button
                class="visibility-button"
                id="visibility-button"
                type="button"
                aria-label="Show code"
                aria-pressed="false"
                title="Show code"
              >
                <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                </svg>
                <svg class="eye-closed hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.7 10.7 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.1 3.1M6.6 6.6C3.6 8.5 2 12 2 12s3.5 8 10 8a9.7 9.7 0 0 0 4.1-.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
            <button type="submit">Unlock</button>
          </div>
          <p class="message" id="code-message" aria-live="polite"></p>
        </form>
      </section>

      <section class="site-shell hidden" id="site" aria-labelledby="site-title">
        <header class="site-header">
          <strong id="account-name">Private Site</strong>
          <button class="lock-button" id="lock-button" type="button" aria-label="Lock site">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M7 10V7a5 5 0 0 1 10 0v3"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M6 10h12v10H6z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </header>
        <div class="placeholder">
          <h2 id="site-title">You are in.</h2>
          <p id="account-title"></p>
          <p>This is where the website content will go next.</p>
        </div>
      </section>
    </main>

    <script>
      const ACCOUNTS = new Map([
        ["HBCJ-STB-4D-UQN-8", "Account 01"],
        ["SRPM-6WZ-QH-BQ9-V", "Account 02"],
        ["H6QS-BYY-BJ-FUH-Z", "Account 03"],
        ["GQDM-8CX-A6-45G-C", "Account 04"],
        ["57X3-3UG-ZT-KM5-H", "Account 05"],
        ["E75Q-XTY-EY-ACF-B", "Account 06"],
        ["WRUK-LMF-EA-GQD-3", "Account 07"],
        ["ZZW4-F72-DQ-DEW-L", "Account 08"],
        ["S9RG-CHH-6E-U8A-Y", "Account 09"],
        ["NKXM-C6M-NK-VEQ-Y", "Account 10"],
        ["B23J-23F-UH-XTK-L", "Account 11"],
        ["BEJW-Z6T-R2-9XB-T", "Account 12"],
        ["WPCH-RCL-HQ-4HD-7", "Account 13"],
        ["WTM6-HHY-46-CPU-8", "Account 14"],
        ["QT8S-XMV-UF-HEY-W", "Account 15"],
        ["2KX5-F6Q-FD-RMT-N", "Account 16"],
        ["YZC9-4TU-US-G26-8", "Account 17"],
        ["UVNL-MGM-HT-6WM-8", "Account 18"],
        ["XWDY-E9L-HP-4B7-W", "Account 19"],
        ["YW6A-LAP-QQ-X9U-J", "Account 20"],
      ]);

      const gate = document.querySelector("#gate");
      const site = document.querySelector("#site");
      const form = document.querySelector("#access-form");
      const input = document.querySelector("#access-code");
      const message = document.querySelector("#code-message");
      const lockButton = document.querySelector("#lock-button");
      const visibilityButton = document.querySelector("#visibility-button");
      const eyeOpen = visibilityButton.querySelector(".eye-open");
      const eyeClosed = visibilityButton.querySelector(".eye-closed");
      const accountName = document.querySelector("#account-name");
      const accountTitle = document.querySelector("#account-title");

      function formatCode(value) {
        const raw = value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 13);
        const groups = [4, 3, 2, 3, 1];
        const parts = [];
        let position = 0;

        for (const length of groups) {
          const part = raw.slice(position, position + length);
          if (!part) break;
          parts.push(part);
          position += length;
        }

        return parts.join("-");
      }

      function showSite(account) {
        gate.classList.add("hidden");
        site.classList.remove("hidden");
        accountName.textContent = `Private Site · ${account}`;
        accountTitle.textContent = `Signed in as ${account}`;
        message.textContent = "";
      }

      function showGate() {
        site.classList.add("hidden");
        gate.classList.remove("hidden");
        input.value = "";
        input.type = "password";
        visibilityButton.setAttribute("aria-label", "Show code");
        visibilityButton.setAttribute("aria-pressed", "false");
        visibilityButton.title = "Show code";
        eyeOpen.classList.remove("hidden");
        eyeClosed.classList.add("hidden");
        input.focus();
      }

      input.addEventListener("input", () => {
        input.value = formatCode(input.value);
        message.textContent = "";
      });

      visibilityButton.addEventListener("click", () => {
        const isVisible = input.type === "text";
        input.type = isVisible ? "password" : "text";
        visibilityButton.setAttribute("aria-label", isVisible ? "Show code" : "Hide code");
        visibilityButton.setAttribute("aria-pressed", String(!isVisible));
        visibilityButton.title = isVisible ? "Show code" : "Hide code";
        eyeOpen.classList.toggle("hidden", !isVisible);
        eyeClosed.classList.toggle("hidden", isVisible);
        input.focus();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const submittedCode = formatCode(input.value.trim());
        input.value = submittedCode;

        if (submittedCode.length !== 17) {
          message.textContent = "Enter the complete 13-character account code.";
          return;
        }

        const account = ACCOUNTS.get(submittedCode);
        if (!account) {
          message.textContent = "That code is not correct.";
          input.select();
          return;
        }

        showSite(account);
      });

      lockButton.addEventListener("click", showGate);
    </script>
  </body>
</html>
