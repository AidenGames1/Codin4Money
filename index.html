<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access Required</title>
    <meta
      name="description"
      content="A simple private access gate for a website."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M20 28h24v20H20z' fill='%23f8fafc'/%3E%3Cpath d='M25 28v-7a7 7 0 0 1 14 0v7' fill='none' stroke='%236ee7b7' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='38' r='3' fill='%230b1220'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: rgba(15, 23, 42, 0.82);
        --panel-strong: rgba(15, 23, 42, 0.95);
        --text: #f8fafc;
        --muted: #9aa9bd;
        --line: rgba(148, 163, 184, 0.24);
        --accent: #6ee7b7;
        --accent-strong: #34d399;
        --danger: #fb7185;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 24% 18%, rgba(110, 231, 183, 0.16), transparent 30%),
          radial-gradient(circle at 78% 74%, rgba(96, 165, 250, 0.14), transparent 26%),
          linear-gradient(135deg, #07111f 0%, #101927 54%, #0c1724 100%);
        color: var(--text);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .gate,
      .site-shell {
        width: min(100%, 430px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .gate {
        padding: 28px;
      }

      .lock-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(110, 231, 183, 0.4);
        border-radius: 8px;
        background: rgba(110, 231, 183, 0.1);
        margin-bottom: 22px;
      }

      .lock-mark svg {
        width: 24px;
        height: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 1rem;
      }

      form {
        display: grid;
        gap: 14px;
        margin-top: 28px;
      }

      label {
        font-size: 0.9rem;
        color: #dbeafe;
      }

      .code-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      input {
        width: 100%;
        min-width: 0;
        height: 52px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 8px;
        background: rgba(2, 6, 23, 0.6);
        color: var(--text);
        font: 700 1.2rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.16em;
        padding: 0 16px;
        text-transform: uppercase;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(110, 231, 183, 0.14);
      }

      button {
        height: 52px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #052e22;
        cursor: pointer;
        font: 800 0.95rem/1 Inter, ui-sans-serif, system-ui, sans-serif;
        padding: 0 18px;
      }

      button:hover,
      button:focus-visible {
        background: var(--accent-strong);
      }

      .message {
        min-height: 22px;
        color: var(--danger);
        font-size: 0.92rem;
      }

      .site-shell {
        width: min(100%, 760px);
        overflow: hidden;
      }

      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-strong);
      }

      .site-header strong {
        font-size: 0.95rem;
      }

      .lock-button {
        width: 40px;
        height: 40px;
        padding: 0;
        display: grid;
        place-items: center;
        background: rgba(248, 250, 252, 0.08);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .lock-button:hover,
      .lock-button:focus-visible {
        background: rgba(248, 250, 252, 0.14);
      }

      .placeholder {
        padding: 52px 32px;
      }

      .placeholder h2 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 5vw, 3rem);
        line-height: 1.02;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 540px) {
        main {
          padding: 18px;
        }

        .gate {
          padding: 22px;
        }

        .code-row {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }

        .placeholder {
          padding: 38px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="gate" id="gate" aria-labelledby="gate-title">
        <div class="lock-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M7 10V7a5 5 0 0 1 10 0v3"
              stroke="#6ee7b7"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M6 10h12v10H6z"
              stroke="#f8fafc"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1 id="gate-title">Enter Code</h1>
        <p>Use the five-character access code to continue.</p>

        <form id="access-form" autocomplete="off" novalidate>
          <label for="access-code">Access code</label>
          <div class="code-row">
            <input
              id="access-code"
              name="access-code"
              type="password"
              inputmode="text"
              minlength="5"
              maxlength="5"
              pattern="[A-Z0-9]{5}"
              placeholder="NED0A"
              aria-describedby="code-message"
              required
            />
            <button type="submit">Unlock</button>
          </div>
          <p class="message" id="code-message" aria-live="polite"></p>
        </form>
      </section>

      <section class="site-shell hidden" id="site" aria-labelledby="site-title">
        <header class="site-header">
          <strong>Private Site</strong>
          <button class="lock-button" id="lock-button" type="button" aria-label="Lock site">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M7 10V7a5 5 0 0 1 10 0v3"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M6 10h12v10H6z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </header>
        <div class="placeholder">
          <h2 id="site-title">You are in.</h2>
          <p>This is where the website content will go next.</p>
        </div>
      </section>
    </main>

    <script>
      const ACCESS_CODES = new Set(["NED0A", "0M0AR"]);

      const gate = document.querySelector("#gate");
      const site = document.querySelector("#site");
      const form = document.querySelector("#access-form");
      const input = document.querySelector("#access-code");
      const message = document.querySelector("#code-message");
      const lockButton = document.querySelector("#lock-button");

      function showSite() {
        gate.classList.add("hidden");
        site.classList.remove("hidden");
        message.textContent = "";
      }

      function showGate() {
        site.classList.add("hidden");
        gate.classList.remove("hidden");
        input.value = "";
        input.focus();
      }

      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
        message.textContent = "";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const submittedCode = input.value
          .trim()
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, "")
          .slice(0, 5);
        input.value = submittedCode;

        if (submittedCode.length !== 5) {
          message.textContent = "Enter exactly five capital letters or numbers.";
          return;
        }

        if (!ACCESS_CODES.has(submittedCode)) {
          message.textContent = "That code is not correct.";
          input.select();
          return;
        }

        showSite();
      });

      lockButton.addEventListener("click", showGate);
    </script>
  </body>
</html>
